<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PoliTrak">
  <title>PoliTrak</title>
  <!-- A five-node graph tracing a P: the stem runs A-D-E, the bowl closes A-B-C-D.
       The product is about who is tied to what, so the monogram is a tie. -->
  <defs>
    <linearGradient id="pt-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#46a6ff"/>
    </linearGradient>
    <radialGradient id="pt-node" cx="34%" cy="28%" r="80%">
      <stop offset="0" stop-color="#7ff0e2"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </radialGradient>
    <radialGradient id="pt-node-blue" cx="34%" cy="28%" r="80%">
      <stop offset="0" stop-color="#9ccdff"/>
      <stop offset="1" stop-color="#46a6ff"/>
    </radialGradient>
  </defs>
  <g fill="none" stroke="url(#pt-edge)" stroke-width="2.6" stroke-linecap="round" opacity=".9">
    <path d="M23 14 L45 20"/>
    <path d="M45 20 L45 34"/>
    <path d="M45 34 L23 38"/>
    <path d="M23 14 L23 52"/>
  </g>
  <circle cx="45" cy="20" r="4.4" fill="url(#pt-node-blue)"/>
  <circle cx="45" cy="34" r="4.4" fill="url(#pt-node-blue)"/>
  <circle cx="23" cy="38" r="4.4" fill="url(#pt-node)"/>
  <circle cx="23" cy="52" r="4.4" fill="url(#pt-node)"/>
  <circle cx="23" cy="14" r="7" fill="url(#pt-node)"/>
</svg>
