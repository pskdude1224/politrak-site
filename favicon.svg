<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PoliTrak">
  <title>PoliTrak</title>
  <!-- The mark, thickened and with one node dropped: at 16px the five-node version fills in. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#46a6ff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#070b11"/>
  <g fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round">
    <path d="M22 16 L44 23"/>
    <path d="M44 23 L44 35"/>
    <path d="M44 35 L22 39"/>
    <path d="M22 16 L22 50"/>
  </g>
  <circle cx="44" cy="23" r="5" fill="#46a6ff"/>
  <circle cx="22" cy="50" r="5" fill="#2dd4bf"/>
  <circle cx="22" cy="16" r="8" fill="#2dd4bf"/>
</svg>
