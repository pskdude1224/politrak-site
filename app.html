<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoliTrak — Key Biscayne</title>
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="pt.css">
<style>
  /* App-shell layout that pt.css doesn't already cover: the three-column
     grid, the search dropdown, rail item rows, and profile-tab cards. */
  /* The web is the point of this page, so the shell is as wide as a 16:9 laptop
     allows and the rails are trimmed to what their content actually needs. */
  .app-wrap { max-width: 1760px; padding-bottom: 40px; }
  .topnav .right { display: flex; align-items: center; gap: 18px; }

  .app-grid { display: grid; grid-template-columns: 228px minmax(0, 1fr) 286px; gap: 20px; align-items: start; margin-top: 6px; }
  .app-grid > .rail { position: sticky; top: 14px; }
  /* One rail at a time: below 1320px the right rail (sources, next dates) folds
     under the panel rather than squeezing the web. */
  @media (max-width: 1320px) {
    .app-grid { grid-template-columns: 220px minmax(0, 1fr); }
    .app-grid > .rail:last-child { grid-column: 1 / -1; position: static; max-height: none; }
    .app-grid > .rail:last-child .rail-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
  }
  @media (max-width: 1000px) {
    /* stretch, not the grid's `start`: in a flex column `start` sized the panel to its
       widest content, which pushed a phone's page 150px past the screen. */
    .app-grid { display: flex; flex-direction: column; align-items: stretch; }
    /* static: a sticky rail above the panel slid along behind the web as the page scrolled. */
    .app-grid > .rail { width: 100%; max-height: none; overflow-y: visible; position: static; }
    /* The people rail used to be one sideways-scrolling strip, and nothing on a phone
       said that more names sat past the edge. It is a wrapped grid now, every name on
       screen, folded behind its toggle while someone's page is open. */
    #left .rail-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
    #left .rail-group-label, #left .rail-item.everything { grid-column: 1 / -1; margin: 6px 0 0; }
    #left .rail-item.everything { margin: 0; }
    #left .rail-item { border: 1px solid var(--line); background: var(--panel2); }
    #left.folded .rail-list { display: none; }
    .rail-fold { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 10px;
      margin-bottom: 8px; padding: 10px 14px; border-radius: 12px; cursor: pointer;
      font: inherit; font-size: 13px; font-weight: 700; color: var(--ink);
      background: var(--panel2); border: 1px solid var(--line); }
    .rail-fold .rf-count { color: var(--mut2); font-weight: 600; margin-left: 6px; }
    .rail-fold .rf-caret { color: var(--teal); transition: transform .15s; }
    #left:not(.folded) .rail-fold .rf-caret { transform: rotate(180deg); }
    #right .rail-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
    #right .right-section { margin-bottom: 0;
      background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  }
  @media (min-width: 1000.02px) { .rail-fold { display: none; } }
  /* Phone width: the group label already says Official or Candidate, so a card keeps
     only what sets it apart (running, the seat, sitting), and the six tabs share the
     row evenly instead of pushing the last two past the screen. */
  @media (max-width: 640px) {
    #left .rail-item .pill:not(.running) { display: none; }
    #left .rail-item { padding: 8px 10px; }
    .tabs { gap: 0; }
    .tab { flex: 1 1 auto; text-align: center; padding: 9px 2px; font-size: 12.5px; }
    /* A seven-column table is three times a phone's width, and the amount sat past the
       edge. Each row becomes a card, every cell labelled with its column (app.mjs copies
       the header onto the cell); sortable headers stay as a row of sort chips. */
    #panel .tbl, #panel .tbl tbody, #panel .tbl tr { display: block; width: 100%; }
    #panel .tbl thead { display: block; }
    #panel .tbl thead:not(:has(.sortable)) { display: none; }
    #panel .tbl thead tr { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 10px; }
    #panel .tbl th { position: static; padding: 3px 10px; border: 1px solid var(--line);
      border-radius: 999px; background: none; }
    #panel .tbl th:not(.sortable) { display: none; }
    #panel .tbl tbody tr { border: 1px solid var(--line-soft); border-radius: 12px;
      padding: 8px 12px; margin-bottom: 8px; background: rgba(255,255,255,.02); }
    #panel .tbl td { display: flex; gap: 10px; padding: 3px 0; border: 0; min-width: 0; }
    #panel .tbl td::before { content: attr(data-label); flex: none; width: 88px; padding-top: 1px;
      color: var(--mut2); font-size: 10.5px; text-transform: uppercase; letter-spacing: .4px; }
    #panel .tbl td:not([data-label])::before, #panel .tbl td[data-label=""]::before { display: none; }
    #panel .tbl td:empty { display: none; }
    #panel .tbl td .src { max-width: 100%; }
  }

  /* ---- search ---- */
  .search-wrap { position: relative; width: 280px; }
  #q { width: 100%; background: var(--panel2); border: 1px solid var(--line); color: var(--ink);
    padding: 8px 12px; border-radius: 10px; font-size: 13px; font-family: inherit; }
  #q:focus { outline: none; border-color: var(--blue); }
  .search-drop { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 18px 40px rgba(0,0,0,.5);
    max-height: 380px; overflow-y: auto; z-index: 50; }
  .search-drop .grp-label { padding: 8px 12px 4px; font-size: 11px; color: var(--mut2);
    text-transform: uppercase; letter-spacing: .5px; }
  .search-item { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 12px; cursor: pointer; font-size: 13px; }
  .search-item:hover { background: rgba(255,255,255,.05); }
  .search-item .kind { color: var(--mut2); font-size: 11px; }

  /* ---- left rail ---- */
  .rail-group-label { font-size: 11px; color: var(--mut2); text-transform: uppercase;
    letter-spacing: .5px; margin: 16px 0 6px; }
  .rail-group-label:first-of-type { margin-top: 0; }
  /* A name is the one thing in this rail that must never be cut: the row is two lines, the name
     wraps, and the pills sit under it. */
  .rail-item { display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
    padding: 8px 10px; border-radius: 10px; cursor: pointer; font-size: 13px; color: var(--ink);
    border: 1px solid transparent; }
  .rail-item:hover { background: rgba(255,255,255,.05); }
  .rail-item.on { background: linear-gradient(100deg, rgba(70,166,255,.16), rgba(45,212,191,.16));
    border-color: rgba(45,212,191,.45); }
  .rail-item.everything { flex-direction: row; align-items: center; font-weight: 700; margin-bottom: 4px; }
  .rail-item .ri-name { line-height: 1.3; overflow-wrap: anywhere; }
  .rail-item .ri-meta { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .rail-item .status { font-size: 11px; color: var(--mut2); }
  /* On the ballot, whatever their day job: a sitting member running again. */
  .pill.running { background: rgba(245,179,66,.14); border-color: rgba(245,179,66,.5); color: var(--amber); }

  /* ---- shared label/value rows (right rail, profile cards) ---- */
  .row { font-size: 13px; margin-bottom: 8px; line-height: 1.5; }
  .row b { color: var(--mut); font-weight: 600; margin-right: 6px; }

  /* ---- pill variants pt.css doesn't define ---- */
  .pill.type { background: transparent; border-color: var(--line); color: var(--mut); }
  .badge-muted { display: inline-block; margin-left: 4px; font-size: 10px; color: var(--mut2);
    text-transform: uppercase; letter-spacing: .4px; }

  /* ---- right rail ---- */
  .right-section { margin-bottom: 22px; }
  .right-section h4 { font-size: 11px; color: var(--mut); text-transform: uppercase;
    letter-spacing: .6px; margin: 0 0 10px; }
  .right-section .row { line-height: 1.4; }
  .right-section .src { display: block; margin-top: 2px; }

  /* ---- main / tabs ---- */
  #main { min-width: 0; }
  /* If something still cannot shrink, it scrolls inside the panel instead of bleeding under the rail. */
  #panel { padding-top: 4px; min-width: 0; overflow-x: auto; }

  /* ---- profile tab ---- */
  .profile-header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 6px; }
  .profile-header h2 { margin: 0; font-size: 24px; letter-spacing: -.3px; }
  .profile-meta { color: var(--mut); font-size: 13px; margin: 0 0 22px; }
  .profile-meta span + span::before { content: ' · '; color: var(--mut2); }
  .profile-section { margin-bottom: 28px; }
  .profile-section h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--mut); margin: 0 0 12px; }
  .tie-group { margin-bottom: 16px; }
  .tie-group .tg-label { font-size: 12px; color: var(--teal); font-weight: 700; margin: 0 0 8px;
    text-transform: capitalize; }
  .tie-row { padding: 8px 10px; margin-bottom: 6px; font-size: 13px; }
  .tie-row .tr-main a { color: var(--ink); font-weight: 600; }
  .tie-row .tr-detail { color: var(--mut); }
  .subject-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .subject-card { cursor: pointer; }
  .subject-card h4 { margin: 0 0 6px; font-size: 15px; }
  .subject-card .sc-row { font-size: 12px; color: var(--mut); margin-bottom: 3px; }
  .subject-card .sc-open { display: inline-block; margin-top: 8px; font-size: 12px; color: var(--blue); }
  .disclosure-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .disclosure-grid .tile { padding: 12px 14px; }
  .disclosure-grid .tile h5 { margin: 0 0 8px; font-size: 12px; color: var(--mut); text-transform: uppercase; letter-spacing: .4px; }
  .disclosure-grid .tile .di-row { font-size: 13px; margin-bottom: 6px; }
  .rel-groups { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 720px) { .rel-groups { grid-template-columns: 1fr; } }
  /* Phone width: the brand and the 280px search box cannot share one row. */
  @media (max-width: 640px) {
    .topnav { flex-wrap: wrap; gap: 10px; }
    .topnav .right { width: 100%; }
    .search-wrap { width: 100%; }
    .brand small { display: none; }
  }
</style>
</head>
<body>
<div class="bg"><div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div><div class="grid"></div></div>

<div class="wrap app-wrap">
  <nav class="topnav">
    <a class="brand" href="index.html" aria-label="PoliTrak home">
      <img src="mark.svg" alt="" width="30" height="30">
      <span class="wordmark">POLITRAK</span>
      <small>Key Biscayne</small>
    </a>
    <div class="right">
      <a class="navlink" href="index.html">Map</a>
      <div class="search-wrap">
        <input id="q" type="text" placeholder="Search people, entities, issues…" autocomplete="off">
        <div id="qdrop" class="search-drop" hidden></div>
      </div>
    </div>
  </nav>

  <div class="app-grid">
    <aside class="rail" id="left"></aside>
    <main id="main">
      <div class="tabs" id="tabs"></div>
      <div id="panel"></div>
    </main>
    <aside class="rail" id="right"></aside>
  </div>
</div>

<script src="data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script type="module" src="app.mjs"></script>
</body>
</html>
